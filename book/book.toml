# A Library: the books on my office shelves at MICA, drawn as spines.
# `bjook build` here (or `bjook watch` for a live preview of the spreads).
# The text is in essay.md, colophon.md and cover.md.

kind   = "shelf"
title  = "A Library"
author = "Kristian Bjørnard"

[page]                  # half letter; margins are for the essay, index and colophon
width   = "5.5in"
height  = "8.5in"
top     = "0.5in"
bottom  = "0.55in"
inside  = "0.45in"
outside = "0.45in"

[type]
text    = "Work Sans"
size    = "10pt"        # the essay
leading = "14pt"

[folio]
size      = "7pt"
position  = "bottom-center"
from_edge = "0.3in"

[shelf]
data   = "../src/lib/data/library.json"   # `npm run sync` refreshes it from Notion
date   = ""             # empty = the date of that sync
mode   = "endless"      # one shelf through the whole book; "wall" = two shelves a spread
scale  = 0              # 0 = by mode (0.4 endless, 0.25 wall)
black_tags = []      # books with these tags print as black spines; none for now
back   = ["essay.md", "index", "images/62835_book.png", "colophon.md"]

[cover]
text   = "cover.md"     # the card on the back cover
bleed  = "0.125in"

# The thirteen spine faces, as the website sets them (src/routes/layout.css).
# Each is self-hosted from the site's own font files.
[faces.work-sans]
family = "Work Sans"
weight = 600
css = "../node_modules/@fontsource/work-sans/600.css"
designer = "Wei Huang"
url = "fonts.google.com/specimen/Work+Sans"

