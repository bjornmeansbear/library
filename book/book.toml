# A Library: the books on my office shelves at MICA, drawn as spines.
# `bjook build` here (or `bjook watch` for a live preview of the spreads).
# The text is in essay.md, colophon.md and cover.md.

kind   = "shelf"
title  = "A Library"
author = "Kristian Bjørnard"

[page]                  # half letter; margins are for the essay, index and colophon
width   = "5.5in"
height  = "8.5in"
top     = "0.5in"
bottom  = "0.55in"
inside  = "0.45in"
outside = "0.45in"

[type]
text    = "Work Sans"
size    = "10pt"        # the essay
leading = "14pt"

[folio]
size      = "7pt"
position  = "bottom-center"
from_edge = "0.3in"

[shelf]
data   = "../src/lib/data/library.json"   # `npm run sync` refreshes it from Notion
date   = ""             # empty = the date of that sync
mode   = "endless"      # one shelf through the whole book; "wall" = two shelves a spread
scale  = 0              # 0 = by mode (0.4 endless, 0.25 wall)
black_tags = []      # books with these tags print as black spines; none for now
second_spines = [     # the books the essay points to: a green block under the black spine.
                      # By title (these also get a green underline in the essay), or as a
                      # group: "the Jerome Agel books after it" (Agel's productions, and
                      # Schnapp and Michaels' book about them)
  "do-it-scenarios-of-the-revolution",
  "herman-kahnsciousness-the-megaton-ideas-of-the-one-man-think",
  "it-s-about-time-and-it-s-about-time",
  "the-electric-information-age-book",
  "climates",
  "eternally-yours-time-in-design",
  "how-buildings-learn-what-happens-after-they-re-built",
  "discreet-music",
  "ambient-1-music-for-airports",
  "how-to-talk-about-books-you-haven-t-read",
  "alphabeta-how-26-letters-shaped-the-western-world",
  "design-for-the-real-world",
  "form-code-in-design-art-and-architecture",
  "conditional-design-workbook",
  "the-future-of-ideas",
  "esthetics-contemporary",
  "six-years",
  "tools-for-conviviality",
  "karl-gerstner",                      # Designing Programmes (Notion title: "Karl Gerstner")
  "the-texbook",
  "faviken",
  "the-medium-is-the-massage",
]
index_mark = "spine"   # in the index, a small green spine beside each of those books
                       # (disc, ring, star, underline: tried 2026-11-27; spine is simple,
                       # noticeable, not intrusive)
title_image = "images/bjornmeansbook.svg"   # the Bjorn Means Book mark on the title page
running = "running.txt"  # one line of type across the top of every spread
running_caps = false
back   = ["essay.md", "index", "images/62835_book.png", "colophon.md"]

[riso]                  # two drums: black, and green after Agel and Fiore's I Seem to Be a Verb
second = "#00A95C"      # riso Green, as near as a screen gets; the quote, the mark, the engraving
                        # and the essay's books
name   = "green"
french_fold = true
paper  = ["17in", "11in"]   # old one-sided 11 x 17, landscape: print the blank side, the old printing
                             # folds inside each leaf
per_sheet = 1                # one leaf a sheet, centered: room for the riso's edge and the cuts
marks  = true

[site]                  # `bjook site --out ~/Code/bjornmeansbook`
text  = ["cover.md", "essay.md"]
links = [["library.wjerk.shop: the live catalog", "https://library.wjerk.shop/"],
         ["library.json: the whole catalog as open data", "https://library.wjerk.shop/library.json"],
         ["Bjook, the tool that typeset it", "../bjook.html"]]

[cover]
text   = "cover.md"     # the card on the back cover
bleed  = "0.125in"
caliper = 0.004         # old copier paper, French fold: each page is a whole sheet thick
hairline = "0.6pt"      # a touch heavier: thin gold on black paper prints faint
marks  = true           # the essay's books as solid gold spines, titles knocked out (one ink: no green here)
riso   = true           # gold ink on black paper; the master is black on white
ink    = "#C2A14D"      # riso gold, as near as a screen gets
paper  = "#161412"      # black paper

